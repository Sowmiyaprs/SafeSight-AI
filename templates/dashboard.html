<!DOCTYPE html>
<html>
<head>

<title>SafeSight AI Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

body{
font-family:'Poppins',sans-serif;
background:#0f172a;
margin:0;
color:white;
}

header{
background:#1e293b;
padding:20px;
text-align:center;
font-size:24px;
font-weight:600;
}

.container{
padding:20px;
}

.cards{
display:flex;
gap:20px;
margin-bottom:30px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:10px;
flex:1;
text-align:center;
}

.card h2{
margin:0;
color:#38bdf8;
}

.section{
margin-top:30px;
}

.camera-box{
background:#1e293b;
padding:20px;
border-radius:10px;
text-align:center;
}

.camera-box img{
width:80%;
border-radius:10px;
}

.gallery{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
}

.gallery img{
width:100%;
border-radius:8px;
border:2px solid #38bdf8;
}

button{
background:#38bdf8;
border:none;
padding:10px 20px;
border-radius:5px;
cursor:pointer;
margin:10px;
font-weight:600;
}

</style>

</head>

<body>

<header>
SafeSight AI Surveillance Dashboard
</header>

<div class="container">

<div class="cards">

<div class="card">
<h2>15</h2>
<p>Total Violations</p>
</div>

<div class="card">
<h2>Camera</h2>
<p>Active</p>
</div>

<div class="card">
<h2>System</h2>
<p>Running</p>
</div>

</div>

<div class="section">

<h2>Live Camera Feed</h2>

<div class="camera-box">
<img src="{{ url_for('video_feed') }}">
</div>

</div>

<div class="section">

<h2>Violation Evidence</h2>

<div class="gallery">

{% for image in images %}

<img src="{{ url_for('static', filename='violations/' + image) }}">

{% endfor %}

</div>

</div>

<div class="section">

<h2>System Control</h2>

<button onclick="location.reload()">Refresh</button>

<button onclick="window.location.href='/stop'">Stop System</button>

</div>

</div>

</body>

</html>
